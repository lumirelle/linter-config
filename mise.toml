monorepo_root = true

[tools]
# Environments
node = 'latest'
nub = 'latest'
# Linters & Formatters
hk = 'latest'
stylua = 'latest'
pkl = 'latest'

[deps.nub]
description = 'Automatically install Node.js dependencies via nub.'
sources = ['mise.toml', 'mise.lock', 'package.json', 'nub.lock']
outputs = ['node_modules/']
run = 'nub pm pin && nub install'
auto = true

[monorepo]
config_roots = ["docs/", "packages/*"]

[env]
_.path = ['{{config_root}}/node_modules/.bin']

# See https://github.com/webpro-nl/knip/issues/1813 & https://github.com/oxc-project/oxc/issues/11834
KNIP_DISABLE_RAW_TRANSFER = 1

[task_config.input_groups]
deps = ["**/package.json", "nub.lock"]
src = ["packages/**/src/**/*"]
check = ["*.js", "*.mjs", "*.cjs", "*.jsx", "*.ts", "*.mts", "*.cts", "*.tsx", "*.vue", "*.json", "*.jsonc", "*.yaml", "*.yml", "*.toml", "*.md", "*.mdc", "*.mdx", "*.lua", "hk.pkl", "playground/*.ts", "playground/*/*/*.{js,ts,json,md}", "playground/*/*/packages/**"]
test = ["packages/**/test/**/*", "packages/**/dist/**/*", "playground/*.ts", "playground/*/*/*.{js,ts,json,md}", "test/**", "scripts/**", "vitest.config.ts"]

[tasks.dev]
description = "Run the development build with hot reloading."
run = { task = "//packages/...:dev" }

[tasks.build]
description = "Run the production build."
run = { task = "//packages/...:build" }

[tasks.start]
description = "Run the source code."
run = { task = "//packages/config:start" }

[tasks.docs]
description = "Run the docs in the specified mode."
usage = '''
arg "<mode>" help="The mode to run the docs in. Can be one of: dev, build, start."
'''
run = { task = "//docs:{{usage.mode}}" }

[tasks.play]
description = "Print the Emissions of one example, of one stack's three flavors, or of every example with `--all`."
# The examples import the package's built entry points, so the Emissions need a fresh build.
depends = "build"
usage = '''
flag "-a --all" help="Print every example"
arg "[name]" help="A stack to print all its flavors, or a flavor-qualified example e.g. ts or eslint/ts"
'''
run = 'nub playground/index.ts {{ "--all" if usage.all else "" }} {{ usage.name if usage.name else "" }}'

[tasks.check]
description = 'Run all checks.'
usage = '''
flag "-s --staged" help="Run on staged files only without stashing unstaged changes"
arg "[rest]" var=#true help="Additional arguments to pass to the test runner"
'''
run = '''
hk check {{ "--staged" if usage.staged else "--all" }} {{ usage.rest | join(sep=' ') if usage.rest else '' }}
'''
sources = ["@group:deps", "@group:check"]
outputs = []
depends = "build"
cache = { enabled = true, command_inputs = ["hk --version"] }

[tasks.fix]
description = 'Fix all check issues.'
usage = '''
flag "-s --staged" help="Run on staged files only without stashing unstaged changes"
arg "[rest]" var=#true help="Additional arguments to pass to the test runner"
'''
run = '''
hk fix {{ "--staged" if usage.staged else "--all" }} {{ usage.rest | join(sep=' ') if usage.rest else '' }}
'''
sources = ["@group:deps", "@group:check"]
outputs = []
depends = "build"
cache = { enabled = true, command_inputs = ["hk --version"] }

[tasks.test]
description = "Run tests."
depends = "build"
usage = '''
flag "-w --watch" help="Watch files for changes and rerun tests"
arg "[rest]" var=#true help="Additional arguments to pass to the test runner"
'''
run = '''
vitest {{ '' if usage.watch else 'run' }} {{ usage.rest | join(sep=' ') if usage.rest else '' }}
'''
sources = ["@group:deps", "@group:src", "@group:test"]
outputs = []
cache = { enabled = true, command_inputs = ["node --version"] }

[tasks.prerelease]
description = 'Prepare for release.'
# All tasks in parallel.
run = { tasks = [":check", ":test"] }

[tasks.release]
description = 'Bump the version and push new version of all packages with a Git tag.'
depends = ":prerelease"
run = "bumpp --recursive"
raw = true

[tasks.changelog]
description = 'Generate GitHub changelog.'
run = "changelogithub"

[tasks.publish]
description = 'Publish the package.'
run = "nub publish --recursive --provenance"

[tasks.publish-commit]
run = "pkg-pr-new publish packages/*"

[tasks."upstream:check"]
description = 'Verify the Upstream submodule tag and the installed npm package match the pin.'
run = 'nub scripts/upstream-check.ts'

[tasks."upstream:diff"]
description = 'Render Source and Upstream under the same options and write a reviewable report.'
depends = "build"
usage = '''
arg "[rest]" var=#true help="Arguments for the diff CLI, e.g. --out path/to/report.md"
'''
run = 'CI=1 nub scripts/upstream-diff.ts {{ usage.rest | join(sep=" ") if usage.rest else "" }}'
