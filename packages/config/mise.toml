[env]
_.path = ['{{config_root}}/node_modules/.bin']

[tasks.dev]
run = "tsdown --watch"

[tasks.build]
run = "tsdown"

[tasks.start]
run = "nub ./src/eslint.ts"

[tasks.inventory]
description = "Regenerate the Oxlint rule inventory from the installed Oxlint."
run = "nub ./scripts/generate-inventory.ts"

[tasks.plugin-rules]
description = "Regenerate the regexp and e18e rule tables from the installed plugins."
run = "nub ./scripts/generate-plugin-rules.ts"

[tasks.stylistic]
description = "Regenerate the stylistic rule table and its option patches from the installed plugin."
run = "nub ./scripts/generate-stylistic-rules.ts"
